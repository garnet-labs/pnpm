actionlint:
  - message: 'reusable workflow call "$/'
    class: intentional-diagnostic
    reason: >-
      The `$/` self-repository form is the shape Jibril failed on upstream
      (ledger F1). Reproducing it is the point of the gate; actionlint not
      knowing the form is the expected output, not a defect to fix.

  - message: 'label "blacksmith-8vcpu-ubuntu-2404" is unknown'
    class: intentional-diagnostic
    reason: >-
      The instrumented cell of pnpm's test matrix runs on this Blacksmith
      label. A GitHub-hosted label would not reproduce the runner the sensor
      has to work on.

  - message: 'label "blacksmith-4vcpu-ubuntu-2404" is unknown'
    class: disclosed
    reason: >-
      pnpm's own file. The finding predates the Garnet rollout and the rollout
      changes only the action SHA on this file.


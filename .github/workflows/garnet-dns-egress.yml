name: Garnet DNS egress

on:
  pull_request:
    paths:
      - 'pnpr/.fixtures/dns-egress/**'
      - '.github/workflows/garnet-dns-egress.yml'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PNPM_VERSION: 12.3.0

jobs:
  install:
    name: Install (recorded)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Garnet Runtime Visibility
        uses: garnet-org/action@540530e93eb6d1caed43f82d3145900d17041f20
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
          jibril_version: v2.17.0-rc.9

      - name: Point resolv.conf at the configured nameserver
        run: |
          NS=$(resolvectl dns 2>/dev/null | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -1); NS=${NS:-127.0.0.53}; printf 'nameserver %s\noptions no_tld_query\n' "$NS" | sudo tee /tmp/resolv.conf; sudo rm -f /etc/resolv.conf; sudo cp /tmp/resolv.conf /etc/resolv.conf; cat /etc/resolv.conf; getent hosts registry.npmjs.org

      - name: Install pnpm
        run: |
          npm install -g pnpm@${PNPM_VERSION}
          pnpm --version

      - name: Install the fixture
        run: cd pnpr/.fixtures/dns-egress && pnpm install --store-dir "$RUNNER_TEMP/store"

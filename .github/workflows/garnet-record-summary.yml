name: Garnet record summary

on: # zizmor: ignore[dangerous-triggers] metadata only; never checks out or executes PR code
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: ["TS CI"]
    types: [completed]

permissions: {}

jobs:
  resolve:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
      || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && contains(fromJSON('["garnet-runtime-review[bot]","garnet-runtime-review-dev[bot]","garnet-ai[bot]"]'), github.event.comment.user.login)
          && contains(github.event.comment.body, '<!-- garnet-runtime-review -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      prs: ${{ steps.resolve.outputs.prs }}
    steps:
      - name: Resolve open opted-in pull requests
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_NUMBER: ${{ github.event.issue.number }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "${EVENT_PR_NUMBER}" ]; then
            candidates=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${EVENT_PR_NUMBER}" --jq '.number')
          else
            candidates=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${EVENT_HEAD_SHA}/pulls?per_page=100" \
              --jq ".[] | select(.head.sha == \"${EVENT_HEAD_SHA}\") | .number")
          fi
          prs=$(
            for pr_number in ${candidates}; do
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
                --jq 'select(.state == "open" and any(.labels[]; .name == "garnet-record-summary")) | .number'
            done | jq -cs 'unique'
          )
          echo "prs=${prs}" >> "${GITHUB_OUTPUT}"

  summary:
    needs: resolve
    if: needs.resolve.outputs.prs != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.resolve.outputs.prs) }}
    concurrency:
      group: garnet-record-summary-${{ matrix.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Recheck opt-in before writing
        id: eligible
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          eligible=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '.state == "open" and any(.labels[]; .name == "garnet-record-summary")')
          echo "apply=${eligible}" >> "${GITHUB_OUTPUT}"
      - name: Write finalized record summary and publish draft
        if: steps.eligible.outputs.apply == 'true'
        uses: garnet-labs/actions/garnet-record-summary@01b9805273fb5d42d08ab2e1833347e0aca2ef7e
        with:
          github-token: ${{ github.token }}
          pr-number: ${{ matrix.pr }}
          publish-draft: "true"

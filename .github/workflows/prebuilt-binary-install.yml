name: Prebuilt binary install

# Installs the `prebuilt-binary-install` fixture from the public registry on a
# real runner. The fixture covers dependencies that download a prebuilt binary
# from their install script, so a change to the fixture's dependencies or to
# which of their builds are allowed shows up here. The install runs under the
# Garnet sensor, so the execution chains it starts and the destinations they
# reach are recorded and compared against the previous commit of the same pull
# request.
on:
  pull_request:
    paths:
      - 'pnpm11/__fixtures__/prebuilt-binary-install/**'
      - '.github/workflows/prebuilt-binary-install.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: prebuilt-binary-install-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  prebuilt-binary-install:
    name: Fixture install (recorded)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Garnet Runtime Visibility
        uses: garnet-org/action@c747ff1f597c84579e10173301a31c30bb815181 # v2.3.0-rc.1
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}

      # The runner's preinstalled Node.js is enough to run pnpm itself, which
      # keeps toolchain setup out of the job and leaves the fixture install as
      # the only network activity it adds.
      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.0.0-rc.6

      - name: Install fixture
        working-directory: pnpm11/__fixtures__/prebuilt-binary-install
        run: pnpm install --no-frozen-lockfile

      # An allowed install script can spawn children that outlive the install.
      # Give the sensor a moment to record them before the profile is
      # finalized.
      - name: Let sensor settle
        if: always()
        run: sleep 45

name: Garnet Dependabot request
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  request:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Request trusted runtime recording
        run: echo "Dependabot recording requested; no PR code is executed in this job."

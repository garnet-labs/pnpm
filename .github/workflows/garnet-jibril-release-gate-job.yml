name: Garnet Jibril Release Gate Job

on:
  workflow_call:
    inputs:
      jibril_version:
        description: 'jibril-releases tag under test'
        required: true
        type: string
      report_pr:
        description: 'fork PR number to comment on'
        required: false
        type: string
        default: '36'
    secrets:
      GARNET_API_TOKEN:
        required: true

permissions: {}

env:
  GARNET_API_URL: https://api.garnet.ai
  GARNET_APP_URL: https://app.garnet.ai

jobs:
  reproduce:
    name: Reproduce self-repo reference on Blacksmith
    # Same runner class as the garnet-enabled leg in ci.yml.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.assert.outputs.verdict }}
      reason: ${{ steps.assert.outputs.reason }}
      status: ${{ steps.assert.outputs.status }}
      version: ${{ steps.assert.outputs.version }}
      unit_active: ${{ steps.assert.outputs.unit_active }}
      steps_status: ${{ steps.assert.outputs.steps_status }}
      workflow_ref: ${{ steps.assert.outputs.workflow_ref }}
      workload: ${{ steps.workload.outcome }}
      runner_name: ${{ steps.assert.outputs.runner_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Garnet runtime monitoring
        uses: garnet-org/action@e546567a72e4fede11ec39d6e9f75b539adef22c # main, v2.3.0 candidate
        # The action fails open anyway; never let the gate abort before the
        # assertion step can record the verdict.
        continue-on-error: true
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
          jibril_version: ${{ inputs.jibril_version }}
          debug: true

      # The verify job later checks that this destination is in the uploaded
      # profile, so a registry outage shows up as "workload not recorded",
      # not as a failed step masking the sensor verdict.
      - name: Workload with egress
        id: workload
        continue-on-error: true
        run: |
          curl -sSf https://registry.npmjs.org/pnpm/latest -o /dev/null
          node -e "fetch('https://registry.npmjs.org/-/ping').then(r=>console.log(r.status))"

      - name: Assert jibril reached the main loop
        id: assert
        if: always()
        env:
          GATE_TAG: ${{ inputs.jibril_version }}
        run: |
          # Poll up to 90s for the runtime status file.
          found=false
          for i in $(seq 1 18); do
            if sudo test -f /var/run/jibril/jibril.status.json; then found=true; break; fi
            sleep 5
          done
          unit_active="$(systemctl is-active jibril || true)"
          echo "--- jibril.service state: $unit_active ---"
          echo "--- journalctl (last 80 lines) ---"
          sudo journalctl -u jibril --no-pager -n 80 || true
          status=""; steps_status="absent"; workflow_ref="absent"; version=""
          if [ "$found" = true ]; then
            sudo cat /var/run/jibril/jibril.status.json | sudo tee /tmp/jibril.status.json >/dev/null
            sudo chown "$(id -u):$(id -g)" /tmp/jibril.status.json
            jq . /tmp/jibril.status.json
            status="$(jq -r '.status // ""' /tmp/jibril.status.json)"
            steps_status="$(jq -r '.features.github.steps.status // "absent"' /tmp/jibril.status.json)"
            workflow_ref="$(jq -r '.features.github.workflow_ref // "absent"' /tmp/jibril.status.json)"
            version="$(jq -r '.version // ""' /tmp/jibril.status.json)"
          fi
          if [ "$unit_active" = active ] && [ "$status" = ok ] && [ "$steps_status" = ok ]; then
            verdict=PASS; reason="sensor active, status ok, github steps resolution ok"
          elif [ "$found" = false ]; then
            verdict=FAIL; reason="status file absent — sensor never reached main loop"
          else
            verdict=FAIL; reason="unit=$unit_active status=${status:-missing} steps_status=$steps_status"
          fi
          {
            echo "verdict=$verdict"
            echo "reason=$reason"
            echo "status=${status:-absent}"
            echo "version=$version"
            echo "unit_active=$unit_active"
            echo "steps_status=$steps_status"
            echo "workflow_ref=$workflow_ref"
            echo "runner_name=$RUNNER_NAME"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Jibril release gate · startup"
            echo "| field | value |"
            echo "|---|---|"
            echo "| requested tag | \`$GATE_TAG\` |"
            echo "| resolved version | \`${version:-unknown}\` |"
            echo "| startup verdict | **$verdict** — $reason |"
            echo "| runner | \`$RUNNER_NAME\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # Everything the sensor produces lands after the reproduce job's post step:
  # the profile flush, the control-plane upload, the App comment. A second job
  # is the only place that can observe them.
  verify:
    name: Verify profile, App comment and permalink
    needs: reproduce
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # upsert the gate comment on the tracking PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify evidence chain
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GARNET_API_TOKEN: ${{ secrets.GARNET_API_TOKEN }}
          GATE_TAG: ${{ inputs.jibril_version }}
          STARTUP_VERDICT: ${{ needs.reproduce.outputs.verdict }}
          STARTUP_REASON: ${{ needs.reproduce.outputs.reason }}
          STARTUP_VERSION: ${{ needs.reproduce.outputs.version }}
          STARTUP_UNIT: ${{ needs.reproduce.outputs.unit_active }}
          STARTUP_STEPS_STATUS: ${{ needs.reproduce.outputs.steps_status }}
          STARTUP_WORKFLOW_REF: ${{ needs.reproduce.outputs.workflow_ref }}
          WORKLOAD_OUTCOME: ${{ needs.reproduce.outputs.workload }}
          RUNNER_NAME_USED: ${{ needs.reproduce.outputs.runner_name }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKLOAD_DESTINATION: registry.npmjs.org
        run: bash .github/scripts/garnet-release-gate-verify.sh

      - name: Keep the gate record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: garnet-release-gate-${{ inputs.jibril_version }}-${{ github.run_attempt }}
          path: |
            /tmp/gate-record.json
            /tmp/gate-comment.md
          if-no-files-found: warn

      - name: Upsert gate comment on the tracking PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT_PR: ${{ inputs.report_pr }}
          GATE_TAG: ${{ inputs.jibril_version }}
        run: |
          export MARKER="<!-- garnet:jibril-release-gate $GATE_TAG -->"
          existing="$(gh api "repos/$GH_REPO/issues/$REPORT_PR/comments" --paginate \
            | jq -r '.[] | select((.body // "") | contains($ENV.MARKER)) | .id' | head -n1)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$existing" -F body=@/tmp/gate-comment.md >/dev/null
          else
            gh pr comment "$REPORT_PR" --repo "$GH_REPO" --body-file /tmp/gate-comment.md
          fi

      - name: Gate conclusion
        if: steps.verify.outputs.verdict != 'PASS'
        env:
          VERDICT: ${{ steps.verify.outputs.verdict }}
        run: |
          echo "::error::gate verdict is '${VERDICT:-none}'; see the gate comment and step summary for the failing legs"
          exit 1

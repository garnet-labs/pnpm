name: Garnet Control Run

on:
  pull_request:

permissions:
  contents: read

jobs:
  garnet-control:
    name: Garnet control (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: garnet-org/action@3d47f4a9004f7356c980a0e8d420ef5984750e3c # v2.2.0
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
      - name: Generate network egress
        run: |
          curl -sS https://registry.npmjs.org/-/ping >/dev/null
          node -e "fetch('https://api.github.com').then(r => console.log('github api', r.status))"

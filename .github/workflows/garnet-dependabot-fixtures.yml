name: Garnet Dependabot Fixture Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/garnet-dependabot-fixtures.yml"
      - "pnpr/.fixtures/**/package.json"
      - "pnpr/.fixtures/**/pnpm-lock.yaml"
      - "pnpr/.fixtures/**/package-lock.json"
      - "pnpr/.fixtures/**/yarn.lock"

permissions:
  contents: read

concurrency:
  group: garnet-dependabot-fixtures-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-runtime-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Garnet Runtime Visibility
        uses: garnet-org/action@245ad6be82de3200c205109c8ca7ac816dc692ea # v2.3.0
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}

      - name: Install fixture dependencies
        env:
          FIXTURE_DIR: pnpr/.fixtures/packages/@pnpm.e2e/has-native-dep/1.0.1
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Installing dependencies in ${FIXTURE_DIR}"
          npm install \
            --prefix "$FIXTURE_DIR" \
            --no-package-lock
          echo "::endgroup::"

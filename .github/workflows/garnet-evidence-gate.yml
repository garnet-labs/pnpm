# Acceptance gate: publishes the `garnet/evidence` check run on the pull
# request head. It succeeds only when a finalized Garnet Runtime Review comment,
# written by the Garnet App, is bound to the exact head; a record still being
# written is pending; missing, stale, or third-party evidence fails.
# Runs from the default branch after a recording workflow completes and again
# each time the Garnet App posts or edits its comment, so the check follows the
# record as more jobs finish. It never checks out or executes pull request code.
# Mark the check `garnet/evidence` required in branch protection to make
# evidence a merge condition.
name: Garnet evidence gate

on: # zizmor: ignore[dangerous-triggers] default branch only, no pull request code runs here
  workflow_run:
    workflows: ["TS CI"]
    types: [completed]
  issue_comment:
    types: [created, edited]

permissions: {}

jobs:
  evidence:
    name: Publish garnet/evidence on the pull request head
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
      || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && contains(fromJSON('["garnet-runtime-review[bot]","garnet-runtime-review-dev[bot]","garnet-ai[bot]"]'), github.event.comment.user.login)
          && contains(github.event.comment.body, '<!-- garnet-runtime-review -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      EVENT_PR_NUMBER: ${{ github.event.issue.number }}
      GARNET_RECORD_WORKFLOWS: '["TS CI"]'
      # comment: no checks:write (needs pull-requests: write); verdict goes to an annotation and one per-head PR comment instead of the check run.
      GARNET_GATE_MODE: check-run
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Wait for the Runtime Review comment to settle
        if: github.event_name == 'workflow_run'
        run: sleep 45
      - name: Resolve the open pull requests at this head
        id: head
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${EVENT_PR_NUMBER}" ]; then
            head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${EVENT_PR_NUMBER}" --jq 'select(.state == "open") | .head.sha')
            prs="${EVENT_PR_NUMBER}"
          else
            head="${EVENT_HEAD_SHA}"
            prs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head}/pulls" --jq ".[] | select(.state == \"open\" and .head.sha == \"${head}\") | .number" | tr '\n' ' ')
          fi
          echo "sha=${head}" >> "${GITHUB_OUTPUT}"
          echo "prs=${prs}" >> "${GITHUB_OUTPUT}"
      - name: Publish garnet/evidence for every open pull request at this head
        if: steps.head.outputs.sha != '' && steps.head.outputs.prs != ''
        shell: bash
        env:
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          PRS: ${{ steps.head.outputs.prs }}
        run: |
          set -euo pipefail
          status=0
          for pr_number in ${PRS}; do
            PR_NUMBER="${pr_number}" node .github/scripts/garnet-evidence-gate.mjs || status=1
          done
          exit "${status}"

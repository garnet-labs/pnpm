name: Garnet slow Jibril stop test

# Forces a Jibril shutdown backlog large enough to push the stop past
# v2.17.0's 5 minute dispatcher drain, then compares v2.17.0 and v2.18.0 on
# the same action ref pnpm pins. Evidence per leg: stop duration (Garnet post
# step), whether /var/log/jibril.profile.json was written, and the profile
# report link.

on:
  push:
    branches:
      - bench/jibril-slow-stop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storm:
    name: ${{ matrix.ver }} / ${{ matrix.flows }} flows / ${{ matrix.rep }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ver: [v2.17.0, v2.18.0]
        flows: ['30000', '120000']
        rep: [a, b]
    steps:
    - name: Checkout Commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Arm stop evidence
      uses: ./.github/actions/garnet-stop-evidence
    - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2
      with:
        api_token: ${{ secrets.GARNET_API_TOKEN }}
        jibril_version: ${{ matrix.ver }}
    - name: Flow storm
      env:
        FLOWS: ${{ matrix.flows }}
        CONCURRENCY: '64'
      run: node .github/scripts/garnet-flow-storm.mjs

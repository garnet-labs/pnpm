# Mirrors the head-bound Garnet Runtime Review comment into the pull request
# description so reviewers and agents that read only the description see the
# same bytes. Runs from the default branch with the repository token after a
# recording workflow completes and again each time the Garnet App posts or edits
# its comment (the App adds jobs to one comment as they finish, so the
# description follows the record). Once a final head-bound record is mirrored it
# publishes a draft pull request (ready for review), and on `/garnet rereview`
# cycles a published one draft -> ready, so reviews start with the record
# present. It never checks out or executes pull request code, never judges the
# pull request and publishes no check.
name: Garnet evidence mirror

on: # zizmor: ignore[dangerous-triggers] default branch only, no pull request code runs here
  workflow_run:
    workflows: ["TS CI", "Garnet Bootstrap Routing"]
    types: [completed]
  issue_comment:
    types: [created, edited]

permissions: {}

# One run at a time: several recorders and several comment edits fire for one
# head, and the per-head lock is a comment, not an atomic write. Nothing is
# cancelled once it started.
concurrency:
  group: garnet-evidence-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror head-bound record into the description
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
      || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && contains(fromJSON('["garnet-runtime-review[bot]","garnet-runtime-review-dev[bot]","garnet-ai[bot]"]'), github.event.comment.user.login)
          && contains(github.event.comment.body, '<!-- garnet-runtime-review -->'))
      || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && github.event.action == 'created'
          && startsWith(github.event.comment.body, '/garnet rereview')
          && (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
              || github.event.comment.user.login == 'devin-ai-integration[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      EVENT_PR_NUMBER: ${{ github.event.issue.number }}
      GARNET_REREVIEW: ${{ github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/garnet rereview') && '1' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Wait for the Runtime Review comment to settle
        if: github.event_name == 'workflow_run'
        run: sleep 45
      - name: Resolve the open pull requests at this head
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${EVENT_PR_NUMBER}" ]; then
            head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${EVENT_PR_NUMBER}" --jq 'select(.state == "open") | .head.sha')
            prs="${EVENT_PR_NUMBER}"
          else
            head="${EVENT_HEAD_SHA}"
            prs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head}/pulls" --jq ".[] | select(.state == \"open\" and .head.sha == \"${head}\") | .number" | tr '\n' ' ')
          fi
          echo "sha=${head}" >> "${GITHUB_OUTPUT}"
          echo "prs=${prs}" >> "${GITHUB_OUTPUT}"
      - name: Mirror into every open pull request at this head
        if: steps.head.outputs.sha != '' && steps.head.outputs.prs != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          PRS: ${{ steps.head.outputs.prs }}
        run: |
          set -euo pipefail
          for pr_number in ${PRS}; do
            PR_NUMBER="${pr_number}" node .github/scripts/garnet-evidence-mirror.mjs
          done

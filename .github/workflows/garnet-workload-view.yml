# Mirror a workload-partitioned Garnet profile into fork PR descriptions.
# This runs from the default branch after TS CI and never executes fork code.
name: Garnet workload view for fork PRs

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ['TS CI']
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  garnet-workload-view:
    name: Render Garnet workload view
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Render each open PR at the completed run head
        shell: bash
        run: |
          set -euo pipefail
          prs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" --jq ".[] | select(.state == \"open\" and .head.sha == \"${HEAD_SHA}\") | .number")
          if [ -z "${prs}" ]; then
            echo "No open PR currently points at ${HEAD_SHA}; skipping stale run."
            exit 0
          fi
          while IFS= read -r pr_number; do
            PR_NUMBER="${pr_number}" node .github/scripts/garnet-workload-view.mjs
          done <<< "${prs}"

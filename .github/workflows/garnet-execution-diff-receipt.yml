# Mirror the execution diff into the fork PR description from the default branch.
name: Garnet execution diff receipt

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ['Garnet Execution Diff']
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  garnet-execution-diff:
    name: Render Garnet execution diff
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Render each open PR at the completed run head
        shell: bash
        run: |
          set -euo pipefail
          prs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" --jq ".[] | select(.state == \"open\" and .head.sha == \"${HEAD_SHA}\") | .number")
          if [ -z "${prs}" ]; then
            echo "No open PR currently points at ${HEAD_SHA}; skipping stale run."
            exit 0
          fi
          while IFS= read -r pr_number; do
            PR_NUMBER="${pr_number}" node .github/scripts/garnet-execution-diff.mjs
          done <<< "${prs}"

name: Garnet jibril v2.18.0-rc.2 flush test

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
          jibril_version: v2.18.0-rc.2
      - name: Generate workload
        run: |
          git clone --depth 1 https://github.com/octocat/Hello-World.git /tmp/hw
          curl -sI https://registry.npmjs.org/pnpm | head -3
          for i in 1 2 3 4 5; do node -e "console.log('beat', $i)"; sleep 5; done

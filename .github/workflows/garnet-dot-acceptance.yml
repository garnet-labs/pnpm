name: Garnet dot-form acceptance

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  reproduce:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Garnet dot-form acceptance / reproduce
    # Control case: identical caller job using the ./ local form.
    uses: ./.github/workflows/garnet-dollar-acceptance-job.yml
    secrets:
      GARNET_API_TOKEN: ${{ secrets.GARNET_API_TOKEN }}

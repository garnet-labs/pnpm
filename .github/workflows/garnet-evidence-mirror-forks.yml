# Mirror the head-bound Garnet Runtime Review comment into fork PR
# descriptions. Runs from the default branch with a privileged token after
# "TS CI" completes; resolves the open PR by the completed run's head SHA and
# never checks out or executes fork code.
name: Garnet evidence mirror for fork PRs

# Safe use of workflow_run: this workflow checks out the default branch only
# and never executes code from the completed run's head.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ['TS CI']
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  garnet-evidence-mirror-fork:
    name: Mirror Garnet evidence for fork PRs
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Mirror each open PR at the completed run head
        shell: bash
        run: |
          set -euo pipefail
          prs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" --jq ".[] | select(.state == \"open\" and .head.sha == \"${HEAD_SHA}\") | .number")
          if [ -z "${prs}" ]; then
            echo "No open PR currently points at ${HEAD_SHA}; skipping stale run."
            exit 0
          fi
          while IFS= read -r pr_number; do
            PR_NUMBER="${pr_number}" node .github/scripts/garnet-evidence-mirror.mjs
          done <<< "${prs}"
      # CodeRabbit and Qodo ignore commands authored by bot accounts
      # (including github-actions[bot]), so the re-review request must come
      # from a user identity: GARNET_REVIEW_TRIGGER_TOKEN is a user PAT with
      # issues write on this repo. Without it the apps drop the commands.
      - name: Request evidence-grounded re-review
        if: env.TRIGGER_TOKEN != ''
        env:
          TRIGGER_TOKEN: ${{ secrets.GARNET_REVIEW_TRIGGER_TOKEN }}
          GH_TOKEN: ${{ secrets.GARNET_REVIEW_TRIGGER_TOKEN }}
        run: |
          set -euo pipefail
          prs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" --jq ".[] | select(.state == \"open\" and .head.sha == \"${HEAD_SHA}\") | .number")
          [ -z "${prs}" ] && exit 0
          while IFS= read -r pr_number; do
            gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" -f body='/agentic_review'
            gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" -f body='@coderabbitai review'
          done <<< "${prs}"

name: Garnet Dependabot OIDC canary
on:
  workflow_dispatch:
permissions:
  {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-oidc:
    name: Verify Garnet OIDC authentication
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # read the workflow repository metadata
      id-token: write # mint an OIDC token for Garnet authentication
    steps:
      - name: Pull public canary image
        run: docker pull node:22-bookworm
      - name: Garnet OIDC registration
        uses: garnet-org/action@f9ed14ab54564073ec11bba8d62d6980e172d2a0 # v2.3.0 candidate (main f9ed14a)
        env:
          GARNET_PROFILE_JOB: dependabot-oidc-canary-${{ github.run_attempt }}
        with:
          jibril_version: v2.17.0
      - name: Harmless trusted workload
        run: |
          set -euo pipefail
          sudo systemctl is-active --quiet jibril.service
          python3 -c 'import urllib.request; print(urllib.request.urlopen("https://pypi.org/pypi/pip/json", timeout=30).status)'
          docker run --rm --user 1001:1001 --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 512m node:22-bookworm node -e 'fetch("https://registry.npmjs.org/ajv").then(r=>{console.log(r.status);if(!r.ok)process.exit(1)})'
          sleep 35
      - name: Validate actual profile
        if: always()
        run: |
          set -euo pipefail
          sudo systemctl stop jibril.service
          sudo test -s /var/log/jibril.profile.json
          sudo cp /var/log/jibril.profile.json "$RUNNER_TEMP/canary.profile.json"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/canary.profile.json"
          python3 -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/canary.profile.json")); assert isinstance(p,dict) and p; print("Nonempty JSON profile present; keys:",list(p))'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: garnet-oidc-canary-profile
          path: ${{ runner.temp }}/canary.profile.json
          if-no-files-found: error
          retention-days: 7

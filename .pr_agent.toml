[github_app]
# Commands run automatically when a PR is opened.
# /improve runs the code-suggestions tool, which also evaluates auto-approval
# (see the auto_approve_* settings under [config]).
pr_commands = [
    "/agentic_describe",
    "/agentic_review",
    "/improve",
]

# Re-run commands when new commits are pushed to the PR.
handle_push_trigger = true

# Commands run automatically on push (requires handle_push_trigger = true).
# /improve is included so auto-approval is re-evaluated on every push, not only
# at open — without it, a PR iterated after open is never re-approved even once
# it is clean.
push_commands = [
    "/agentic_review",
    "/improve",
]

[config]
# Skip automated reviews on bot-authored PRs (e.g. dependency bumps).
# Qodo auto-detects most bots; these are listed explicitly to be safe.
ignore_pr_authors = [
    "dependabot[bot]",
    "renovate[bot]",
]

# Optional: also skip reviews on chore/ci PRs by title (regex list).
# Left commented so maintainers can opt in. Note that bot dependency bumps
# are already covered by ignore_pr_authors above.
# ignore_pr_title = ["^chore", "^ci"]

# Product labels are applied by CodeRabbit (see .coderabbit.yaml), so Qodo's
# label tooling is intentionally left off to avoid two tools fighting over labels.

# Auto-approve a PR when Qodo finds nothing to fix. enable_auto_approval is the
# required master switch (off by default). Both conditions below are evaluated by
# the /improve tool (see pr_commands and push_commands), so approval is re-checked
# on open and on every push; these flags only take effect from the config file on
# the default branch:
#   - auto_approve_for_no_suggestions: approve when /improve yields zero suggestions.
#   - auto_approve_for_low_review_effort: approve when the estimated review effort
#     is at or below this score (1=trivial .. 5=very involved); 2 covers small PRs.
enable_auto_approval = true
auto_approve_for_no_suggestions = true
auto_approve_for_low_review_effort = 2

[review_agent]
# `both` keeps every finding in the review summary; the threshold only
# controls which ones are *also* posted as standalone inline threads.
# Keep that bar high so per-push re-reviews don't repost low-severity
# (perf/style) nits as new inline threads on every commit — the
# higher-severity findings still surface inline, and everything remains
# in the summary.
comments_location_policy = "both"
inline_comments_severity_threshold = 3
issues_user_guidelines = """
Apply the review framework in REVIEW_GUIDE.md. The repo's priority order — security first, performance second — applies to every reviewer. You are one of two bots: to avoid duplicate comments, you provide the primary depth on security and performance while CodeRabbit provides the primary depth on correctness and convention adherence; always still report any clear correctness bug or documented-convention violation you find. Lead on: (1) security vulnerabilities per REVIEW_GUIDE.md's "Security review rules"; (2) performance regressions in pnpm, pacquet, and pnpr per REVIEW_GUIDE.md's "Performance review rules". Surface only issues tied to changed code, and explain the exploit path, impact, or hot path affected.

Garnet runtime evidence: PRs in this repo carry a head-SHA-bound Execution Profile of the instrumented CI job, recorded at the kernel by Garnet (execution chains, each a root-to-action path; today's action class is the outbound connection, whose endpoint is the destination). The evidence arrives in the PR description's "Runtime evidence (Garnet)" section between the `<!-- garnet:evidence:begin -->` and `<!-- garnet:evidence:end -->` markers, mirrored verbatim from the trusted Garnet Runtime Review comment; a committed `.garnet/runtime-evidence.md` file in the diff is an equivalent legacy transport. Follow REVIEW.md: use the record only when its `<!-- garnet:commit ... -->` marker equals the PR head, and open the review body with the one-line "**Runtime grounding** (head `<sha7>`): ..." verdict — stating stale/absent evidence explicitly when that is the case. When head-bound evidence is present, read it before finalizing the review and reconcile it with the static diff:
(1) For dependency, lockfile, or CI changes, state explicitly which execution chains rooted in install/build/test tooling (pnpm, node, node-gyp, install scripts) the recording shows and which destinations they reached, and whether any of those are new relative to the record's named baseline commit. Treat every new workload destination as a security finding under REVIEW_GUIDE.md's "Security review rules" with inline-severity treatment, naming the destination and the execution chain that reached it; an explanation in the diff informs the trust assessment but never exempts the destination from it.
(2) Do not attribute chains the profile classifies as runner background (systemd-rooted, no recorded workflow step) to the PR — classify them as runner platform behavior.
(3) Label findings backed by the recording as "verified at runtime" and everything else as static inference. Runtime evidence covers only the recorded jobs; it never clears unrecorded gates or paths CI did not execute, and a clean static diff does not outrank recorded runtime egress.
(4) Judge staleness by the record's named comparison pair: if the recorded SHA is older than the PR head, check whether later commits touch only review metadata (`.garnet/**`, review config); if so the evidence remains representative, otherwise call it stale.
"""
compliance_user_guidelines = """
Enforce the security and performance contracts in REVIEW_GUIDE.md's "Security review rules" and "Performance review rules" sections. When head-bound Garnet runtime evidence is present (the PR description's "Runtime evidence (Garnet)" section, or a committed `.garnet/runtime-evidence.md`), also enforce the Garnet runtime evidence contract described in issues_user_guidelines.
"""
